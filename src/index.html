<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' data:" />
  <title>Learning Arabic Tool</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="app-title">Learning Arabic Tool</span>
        <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Seitenleiste ein-/ausklappen" title="Seitenleiste ein-/ausklappen">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
      <ul class="main-nav" id="main-nav">
        <li>
          <button id="nav-dashboard" class="nav-item" data-nav="dashboard" title="Start">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
            <span>Start</span>
          </button>
        </li>
        <li>
          <button id="nav-course" class="nav-item" data-nav="course" title="Kurs">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 012-2h11a2 2 0 012 2v14.5"/><path d="M6 21.5A2.5 2.5 0 018.5 19H19"/></svg>
            <span>Kurs</span>
          </button>
        </li>
        <li>
          <button id="nav-review" class="nav-item" data-nav="review" title="Wiederholen">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5.5 9A7.5 7.5 0 0119 8"/><path d="M18.5 15a7.5 7.5 0 01-13.5 1"/></svg>
            <span>Wiederholen</span>
          </button>
        </li>
        <li>
          <button id="nav-free-practice" class="nav-item" data-nav="free-practice" title="Frei üben">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>
            <span>Frei üben</span>
          </button>
        </li>
        <li>
          <button id="nav-progress" class="nav-item" data-nav="progress" title="Fortschritt">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11"/><path d="M11 20V4"/><path d="M18 20v-7"/></svg>
            <span>Fortschritt</span>
          </button>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button id="nav-settings" class="nav-item" data-nav="settings" title="Einstellungen">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M17 7h3M4 12h3M8 12h12M4 17h10M17 17h3"/><circle cx="14" cy="7" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg>
          <span>Einstellungen</span>
        </button>
        <span class="version-info">Learning Arabic Tool · v0.1.0</span>
      </div>
    </nav>
    <div class="main-area">
      <header class="app-header" id="app-header"></header>
      <main class="content" id="content">
        <div class="loading-placeholder">Lädt…</div>
      </main>
    </div>
  </div>

  <script src="js/srs.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/audioPlayer.js"></script>
  <script src="js/keyboardData.js"></script>
  <script src="js/textEditing.js"></script>
  <script src="js/wordShaping.js"></script>
  <script src="js/state.js"></script>
  <script src="js/lessonProgress.js"></script>
  <script src="js/exerciseGuard.js"></script>
  <script src="js/theoryRenderer.js"></script>
  <script src="js/helpLevel.js"></script>
  <script src="js/reviewScheduler.js"></script>
  <script src="js/practicePool.js"></script>
  <script src="js/progressStats.js"></script>
  <script src="js/session/sessionState.js"></script>
  <script src="js/session/phaseRegistry.js"></script>
  <script src="js/session/sessionCoverageTracker.js"></script>
  <script src="js/session/sessionQueue.js"></script>
  <script src="js/session/exerciseRegistry.js"></script>
  <script src="js/session/sessionEngine.js"></script>
  <script src="js/session/sessionRenderer.js"></script>
  <script src="js/views/virtualKeyboard.js"></script>
  <script src="js/views/connectionTrainer.js"></script>
  <script src="js/views/onboarding.js"></script>
  <script src="js/views/keyboardTutorial.js"></script>
  <script src="js/views/alphabet.js"></script>
  <script src="js/views/letterGroupLesson.js"></script>
  <script src="js/views/vocalization.js"></script>
  <script src="js/views/unit10.js"></script>
  <script src="js/views/grammar.js"></script>
  <script src="js/views/grammar2.js"></script>
  <script src="js/views/grammar3.js"></script>
  <script src="js/views/vocabulary.js"></script>
  <script src="js/views/listening.js"></script>
  <script src="js/views/reading.js"></script>
  <script src="js/views/exam.js"></script>
  <script src="js/views/freePractice.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/courseView.js"></script>
  <script src="js/views/unitDetailView.js"></script>
  <script src="js/session/sessionController.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/statistics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
