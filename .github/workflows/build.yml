name: Build & Release (Desktop, optional)

# "Website statt Installer": die primäre, automatische Veröffentlichung läuft seitdem über
# .github/workflows/pages.yml (GitHub Pages bei jedem Push auf main). Dieser Workflow bleibt
# als OPTIONALES, rein manuelles Werkzeug erhalten, falls doch einmal ein Desktop-Installer
# gebraucht wird (main.js/preload.js/die electron-builder-Konfiguration existieren weiterhin,
# siehe DEVELOPMENT_FOUNDATION.md) -- läuft NICHT mehr automatisch bei jedem Push/Tag/PR, nur
# noch über "Run workflow" im Actions-Tab. Genau EIN zentraler Release-Job sammelt danach alle
# Plattform-Artefakte und veröffentlicht GENAU EIN GitHub-Release -- nicht mehrere parallele.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Nach dem Bauen zusätzlich ein GitHub-Release veröffentlichen (nur sinnvoll, wenn dieser Lauf gezielt gegen einen Versionstag gestartet wird)'
        type: boolean
        default: false

# Standardmäßig nur Leserechte (Abschnitt 13) -- contents:write wird ausschließlich im
# release-Job unten gezielt wieder angehoben.
permissions:
  contents: read

jobs:
  test:
    name: Lint + Kurs-Validierung + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint (Syntax, JSON, Namenskollisionen)
        run: npm run lint

      - name: Kurs-Validierung
        run: npm run validate:course

      - name: Tests (Unit + Integration)
        run: npm test

  check-version:
    name: package.json-Version gegen Tag prüfen
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Version == Tag, sonst Abbruch
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          echo "Tag: $TAG -> erwartete Version: $EXPECTED / package.json: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::package.json-Version ($ACTUAL) stimmt nicht mit dem Tag ($TAG) überein -- Abbruch."
            exit 1
          fi

  build:
    name: Paket bauen + verifizieren (${{ matrix.os }})
    needs: [test]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
            artifact_glob: dist/*.exe
          - os: ubuntu-latest
            platform_flag: --linux
            artifact_glob: |
              dist/*.deb
              dist/*.AppImage
          - os: macos-latest
            platform_flag: --mac
            artifact_glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Paket bauen (electron-builder veröffentlicht selbst NICHTS -- das übernimmt allein der release-Job)
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never

      - name: Gebautes Paket verifizieren (release:verify)
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            node scripts/releaseVerify.js --tag "${GITHUB_REF_NAME}"
          else
            node scripts/releaseVerify.js
          fi

      - name: Installer als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Einziges GitHub-Release veröffentlichen
    needs: [build, check-version]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alle Plattform-Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: dist-*
          merge-multiple: true

      - name: SHA256SUMS.txt erzeugen
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Genau EIN öffentliches Prerelease erstellen (kein Draft)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "Learning Arabic Tool – Kurs 1 Beta – Audio generated with ElevenLabs (elevenlabs.io)"
          draft: false
          prerelease: true
          files: release-artifacts/*
          body: |
            ## Learning Arabic Tool – Kurs 1 Beta (${{ github.ref_name }})

            **Audio generated with ElevenLabs (elevenlabs.io).**

            ### Enthalten
            - Vollständiger Kurs 1: 900 Vokabeln, 30 Units, 90 Sessions
            - Zehn-Stufen-Lernablauf (Lernziele → Theorie → Lernkarten → Audio → Wortübersicht →
              Wiedererkennen → Zuordnung → Schreiben mit/ohne Hilfe → Zusammenfassung)
            - Normale + (teilweise) langsame Audiodateien, Hell-/Dunkelmodus, anpassbare arabische
              Schriftgröße, lokaler Fortschritt, vollständiger Offlinebetrieb nach der Installation

            ### Einschränkungen (bitte vor der Nutzung lesen)
            - **Beta:** Kurs 1 ist technisch vollständig, aber **noch nicht** von einer Person mit
              Arabischkenntnissen sprachlich freigegeben; Audiodateien technisch integriert, aber
              nicht vollständig akustisch geprüft. Nicht als verbindliches Unterrichtsmaterial
              verwenden, bevor diese Prüfung erfolgt ist.
            - **ElevenLabs-Audios (kostenloser Tarif):** nur **nichtkommerzielle** Nutzung erlaubt,
              siehe NOTICE-AUDIO.md im Repository. Der Anwendungscode selbst bleibt MIT-lizenziert.
            - Windows/macOS-Installer sind **nicht codesigniert** — siehe README für den Umgang mit
              SmartScreen-/Gatekeeper-Warnungen bei einer aus dem offiziellen Repository geladenen
              Datei.

            ### Installation
            Ausführliche, betriebssystemspezifische Anleitung: siehe
            [README.md](https://github.com/${{ github.repository }}#readme).

            | Datei | Betriebssystem |
            |---|---|
            | `*-Windows-x64-Setup.exe` | Windows 10/11 (Installer) |
            | `*-Windows-x64-Portable.exe` | Windows 10/11 (portable, keine Installation) |
            | `*-Ubuntu-amd64.deb` | Ubuntu/Debian x64 |
            | `*-Linux-x86_64.AppImage` | Allgemeines Linux x64 |
            | `*-macOS-x64.dmg` | macOS Intel |
            | `*-macOS-arm64.dmg` | macOS Apple Silicon (M1/M2/M3/…) |
            | `SHA256SUMS.txt` | Prüfsummen aller obigen Dateien |
